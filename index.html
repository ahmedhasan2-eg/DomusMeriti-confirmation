  function ltr(s){ return s ? ("⁦"+s+"⁩") : s; }
  var link=((ctaLine(o).match(/https?:\/\/\S+/)||[""])[0])||"";
  var comp=(o.company||"").trim();
  var TITLE=jobTitle(o);
  var SAL=(o.salary||"").trim();
  var ENG=(o.languageLevel||"").trim();
  var OL=(o.language||"").trim();
  var loc=simpleLocation(o)||(o.branch||"").trim();
  var det=((o.workingHours||"")+" "+(o.offerDetails||"")+" "+SAL+" "+(o.campaign||"")+" "+(o.type||"")).toLowerCase();
  var comm=hasCommission(o), noexp=isNoExp(o), wfh=hasWFH(o), transport=hasTransport(o);
  var showComm = comm && !/commission|uncapped|عمول/i.test(SAL);
  var femOnly=femalesOnly(o), maleOnly=malesOnly(o);
  var gradsO=gradsOnly(o), uOK=undergradOK(o);
  var exp=(o.experience||"").trim();
  var FLAG={french:"🇫🇷",spanish:"🇪🇸",german:"🇩🇪",dutch:"🇳🇱",portuguese:"🇵🇹",italian:"🇮🇹",arabic:"🇪🇬"};
  var olKey=OL.toLowerCase();
  var fl=FLAG[olKey]||"";
  var isForeign = fl && olKey!=="arabic";
  var langName = OL?cap(OL):"English";
  function engHasName(){ return !!(ENG && olKey && new RegExp(olKey,"i").test(ENG)); }
  var hasLevel = /[abc][12]|fluent|native|c2/i.test(ENG);
  function langReqTxt(){ return engHasName()?ENG:(langName+(ENG?(" "+ENG):"")); }

  function roleWord(){
    if(/chat|email|mail/.test(det)) return lang==="ar"?"Chat & Email Support":"Chat & Email Support";
    if(/telesales|outbound|cold call|opener|closer|setter|bdr/.test(det)) return lang==="ar"?"Telesales":"Telesales / Sales";
    if(/customer|support|cs\b/.test(det)) return "Customer Service";
    if(/back\s*office/.test(det)) return "Back Office";
    if(/chef|شيف|kitchen|مطبخ/.test(det)) return lang==="ar"?"شيف":"Chef";
    if(/driver|سائق/.test(det)) return lang==="ar"?"سائق":"Driver";
    return TITLE;
  }
  var roleIcon = /chat|email|mail/.test(det)?"💬":(/telesales|sales|outbound|cold call|opener|closer|setter|bdr/.test(det)?"📞":(/chef|شيف|kitchen|مطبخ/.test(det)?"👨‍🍳":(/driver|سائق/.test(det)?"🚗":"🎧")));
  var shiftEN = /rotational|متغير/.test(det)?"🔄 Rotational shifts":(/fixed/.test(det)?"🕒 Fixed shift":(/night|overnight/.test(det)?"🌙 Night shift":(/morning/.test(det)?"☀️ Morning shifts":"")));
  var shiftAR = /rotational|متغير/.test(det)?"🔄 شيفتات متغيرة":(/fixed/.test(det)?"🕒 شيفت ثابت":(/night|overnight|ليل/.test(det)?"🌙 شيفت ليلي":(/morning|صباح/.test(det)?"☀️ شيفت صباحي":"")));

  function salEN(){
    if(!SAL) return comm?"💰 Uncapped commission":"";
    if(isForeign) return fl+" "+langReqTxt()+" → "+SAL+(showComm?" + commission":"");
    return "💰 "+SAL+(showComm?" + uncapped commission":"");
  }
  function salAR(){
    if(!SAL) return comm?"💸 عمولة من غير حد أقصى":"";
    if(isForeign) return fl+" "+(engHasName()?ltr(ENG):(langName+(ENG?(" "+ltr(ENG)):"")))+" ← "+ltr(SAL)+(showComm?" + عمولة":"");
    return "💰 المرتب: "+ltr(SAL)+(showComm?" + عمولة من غير حد أقصى 💸":"");
  }

  function reqsEN(){
    var r=[];
    if(femOnly) r.push("Females only"); else if(maleOnly) r.push("Males only");
    if(o.nationality){ r.push(/egypt/i.test(o.nationality)?"Egyptians only":o.nationality); }
    if(gradsO) r.push("Graduates only"); else if(uOK) r.push("Grads & undergrads welcome");
    if(isForeign) r.push(langReqTxt());
    else if(ENG && hasLevel) r.push("English "+ENG);
    if(exp) r.push(/no\s*exp|fresh|not\s*required|لا يشترط|مش شرط/i.test(exp)?"No experience needed":exp);
    return r;
  }
  function reqsAR(){
    var r=[];
    if(femOnly) r.push("بنات بس 👩"); else if(maleOnly) r.push("شباب بس 👨");
    if(o.nationality){ r.push(/egypt/i.test(o.nationality)?"مصريين بس":o.nationality); }
    if(gradsO) r.push("خريجين بس"); else if(uOK) r.push("خريجين وطلبة");
    if(isForeign) r.push(engHasName()?ltr(ENG):(langName+(ENG?(" "+ltr(ENG)):"")));
    else if(ENG && hasLevel) r.push("English "+ltr(ENG));
    if(exp) r.push(/no\s*exp|fresh|not\s*required|لا يشترط|مش شرط/i.test(exp)?"مش شرط خبرة":ltr(exp));
    return r;
  }
  function bul(arr,mark){ return arr.filter(Boolean).map(function(x){return (mark||"✅")+" "+x;}).join("\n"); }
  function meta(arr){ return arr.filter(Boolean).join("\n"); }
  function tagLine(n){ return ""; } /* hashtags removed by request */
  function cap1(s){ return s?s.toUpperCase():s; }

  var out=[];

  if(lang==="en"){
    var CTA=[
      "📩 Qualified? Send your CV via DM now! 🔥\n"+link,
      "📲 Interested? WhatsApp me today 👇\n"+link,
      "📩 DM your CV to apply! 🚀\n"+link,
      "📲 Ready for your next move? Message me now 👇\n"+link,
      "📩 Apply now to be considered 👇\n"+link,
      "📩 Don't miss out — apply today!\n"+link,
      "📲 Send your CV on WhatsApp now 🔥\n"+link
    ];
    var rib=roleWord();

    /* 1 — Bold blast */
    out.push({label:"Bold blast", text:[
      "🔥🔥 "+cap1(rib)+" — "+cap1(comp)+"! "+roleIcon,
      "",
      "Tired of searching? Your next opportunity is here! 🚀",
      "",
      salEN(),
      meta([roleIcon+" "+rib, shiftEN, loc?("📍 "+loc):""]),
      "",
      bul(reqsEN()),
      "",
      CTA[0]
    ].filter(function(x){return x!==undefined;}).join("\n").replace(/\n{3,}/g,"\n\n").trim()+tagLine(3)});

    /* 2 — Salary first */
    out.push({label:"Salary first", text:[
      "💸 TOP PAY — "+cap1(rib)+"! 🔥",
      "",
      salEN(),
      "",
      meta([roleIcon+" "+rib+" — "+comp, shiftEN, loc?("📍 "+loc):""]),
      "",
      "Requirements:",
      bul(reqsEN()),
      "",
      CTA[2]
    ].join("\n").replace(/\n{3,}/g,"\n\n").trim()});

    /* 3 — Candidate hook */
    var hook3 = isForeign?("Fluent in "+langName+"? Your skills are in demand! 🔥")
             : wfh?("Looking for a work-from-home role? 🏠")
             : noexp?("No experience? No problem — we'll train you! 🌱")
             : ("Looking for your next "+rib+" role? 👀");
    out.push({label:"Candidate hook", text:[
      roleIcon+" "+hook3,
      "",
      "We're hiring "+rib+" at "+comp+":",
      "",
      salEN(),
      meta([shiftEN, loc?("📍 "+loc):""]),
      "",
      bul(reqsEN()),
      "",
      CTA[1]
    ].join("\n").replace(/\n{3,}/g,"\n\n").trim()});

    /* 4 — Formal / professional */
    out.push({label:"Formal", text:[
      "📢 HIRING | "+rib.toUpperCase(),
      "",
      "We are seeking "+(exp&&!/no\s*exp|fresh/i.test(exp)?"experienced ":"")+(isForeign?(langName+"-speaking "):"")+"candidates for a "+rib+" role at "+comp+".",
      "",
      salEN(),
      meta(["Position: "+rib, shiftEN?("Shifts: "+shiftEN.replace(/^[^ ]+ /,"")):"", loc?("Location: "+loc):""]),
      "",
      "Requirements",
      bul(reqsEN(),"•"),
      "",
      CTA[4]
    ].join("\n").replace(/\n{3,}/g,"\n\n").trim()});

    /* 5 — Benefits focused */
    var perksEN=[];
    if(transport) perksEN.push("🚌 Transportation provided");
    if(/medical|insurance|تأمين/.test(det)) perksEN.push("🏥 Medical & social insurance");
    if(/paid\s*training/.test(det)) perksEN.push("🎓 Paid training");
    if(wfh) perksEN.push("🏠 Work from home");
    if(/2\s*days?\s*off|يومين/.test(det)) perksEN.push("📅 2 days off / week");
    if(!perksEN.length) perksEN.push("🚀 Great career growth");
    out.push({label:"Benefits", text:[
      "🌟 JOIN "+comp.toUpperCase()+" — "+rib.toUpperCase()+"!",
      "",
      salEN(),
      "",
      "What you get:",
      bul(perksEN),
      "",
      meta([loc?("📍 "+loc):"", shiftEN]),
      "",
      bul(reqsEN()),
      "",
      CTA[3]
    ].join("\n").replace(/\n{3,}/g,"\n\n").trim()});

    /* 6 — Short punchy */
    out.push({label:"Short punchy", text:[
      "🚨 "+cap1(rib)+" HIRING NOW! "+roleIcon,
      "",
      salEN(),
      meta([shiftEN, loc?("📍 "+loc):""]),
      "",
      bul(reqsEN().slice(0,3)),
      "",
      CTA[6]
    ].join("\n").replace(/\n{3,}/g,"\n\n").trim()});

    /* 7 — Career growth */
    out.push({label:"Career", text:[
      "🚀 TAKE YOUR CAREER TO THE NEXT LEVEL!",
      "",
      "We're looking for "+(isForeign?(langName+" speakers"):"talented people")+" to join "+comp+" as "+rib+".",
      "",
      salEN(),
      meta([shiftEN, loc?("📍 "+loc):""]),
      "",
      bul(reqsEN()),
      "",
      CTA[5]
    ].join("\n").replace(/\n{3,}/g,"\n\n").trim()});

  } else {
    var CTAa=[
      "📲 للتقديم كلّمني واتساب دلوقتي 👇\n"+ltr(link),
      "📩 مهتم؟ ابعتلي الـCV على واتساب 🔥\n"+ltr(link),
      "📲 قدّم دلوقتي — واتساب على 👇\n"+ltr(link),
      "📩 متفوّتش الفرصة، ابعتلي النهارده!\n"+ltr(link),
      "📲 التواصل والتقديم واتساب 👇\n"+ltr(link)
    ];
    var rib=roleWord();

    /* 1 — فرصتك وصلت */
    out.push({label:"فرصتك وصلت", text:[
      "🚀🔥 فرصتك تشتغل مع "+ltr(comp)+" وصلت! "+roleIcon,
      "",
      "لو بتدور على شغل في مجال الـ"+ltr(rib)+"، دي فرصتك! 💪",
      "",
      salAR(),
      meta([shiftAR, loc?("📍 "+loc):""]),
      "",
      bul(reqsAR()),
      "",
      CTAa[0]
    ].join("\n").replace(/\n{3,}/g,"\n\n").trim()+tagLine(4)});

    /* 2 — المرتب الأول */
    out.push({label:"المرتب الأول", text:[
      "💸 مرتب مميز — "+ltr(rib)+"! 🔥",
      "",
      salAR(),
      "",
      meta([roleIcon+" "+ltr(rib)+" — "+ltr(comp), shiftAR, loc?("📍 "+loc):""]),
      "",
      "الشروط:",
      bul(reqsAR()),
      "",
      CTAa[1]
    ].join("\n").replace(/\n{3,}/g,"\n\n").trim()});

    /* 3 — سؤال للكانديدت */
    var hook3a = isForeign?("بتتكلم "+ltr(langName)+" كويس؟ مهاراتك مطلوبة! 🔥")
              : wfh?("بتدوّر على شغل من البيت؟ 🏠")
              : noexp?("لسه مخرّجتش أو معندكش خبرة؟ احنا بندرّبك! 🌱")
              : ("بتدوّر على شغل في الـ"+ltr(rib)+"؟ 👀");
    out.push({label:"للكانديدت", text:[
      roleIcon+" "+hook3a,
      "",
      "مطلوب "+ltr(rib)+" للعمل مع "+ltr(comp)+":",
      "",
      salAR(),
      meta([shiftAR, loc?("📍 "+loc):""]),
      "",
      bul(reqsAR()),
      "",
      CTAa[2]
    ].join("\n").replace(/\n{3,}/g,"\n\n").trim()});

    /* 4 — رسمي */
    out.push({label:"رسمي", text:[
      "📢 مطلوب "+ltr(rib)+" للعمل بشركة "+ltr(comp),
      "",
      "فرصة عمل متاحة"+(loc?(" في "+loc):"")+(SAL?(" براتب "+ltr(SAL)):"")+".",
      "",
      salAR(),
      meta([shiftAR, loc?("📍 "+loc):""]),
      "",
      "الشروط المطلوبة:",
      bul(reqsAR(),"•"),
      "",
      CTAa[4]
    ].join("\n").replace(/\n{3,}/g,"\n\n").trim()});

    /* 5 — المزايا */
    var perksAR=[];
    if(transport) perksAR.push("🚌 مواصلات");
    if(/medical|insurance|تأمين/.test(det)) perksAR.push("🏥 تأمين طبي واجتماعي");
    if(/paid\s*training|تدريب/.test(det)) perksAR.push("🎓 تدريب مدفوع");
    if(wfh) perksAR.push("🏠 شغل من البيت");
    if(/2\s*days?\s*off|يومين/.test(det)) perksAR.push("📅 يومين إجازة");
    if(!perksAR.length) perksAR.push("🚀 فرص ترقّي حقيقية");
    out.push({label:"المزايا", text:[
      "🌟 انضم لفريق "+ltr(comp)+" — "+ltr(rib)+"!",
      "",
      salAR(),
      "",
      "مزايا الشغل:",
      bul(perksAR),
      "",
      meta([loc?("📍 "+loc):"", shiftAR]),
      "",
      bul(reqsAR()),
      "",
      CTAa[0]
    ].join("\n").replace(/\n{3,}/g,"\n\n").trim()});

    /* 6 — قصير */
    out.push({label:"قصير", text:[
      "🚨 مطلوب "+ltr(rib)+" — "+ltr(comp)+"! "+roleIcon,
      "",
      salAR(),
      meta([shiftAR, loc?("📍 "+loc):""]),
      "",
      bul(reqsAR().slice(0,3)),
      "",
      CTAa[2]
    ].join("\n").replace(/\n{3,}/g,"\n\n").trim()});

    /* 7 — اعمل شير */
    out.push({label:"اعمل شير", text:[
      "📣 "+ltr(comp)+" فاتحة باب التعيين! "+roleIcon,
      "",
      "مطلوب "+ltr(rib)+(loc?(" في "+loc):"")+".",
      "",
      salAR(),
      meta([shiftAR]),
      "",
      bul(reqsAR().slice(0,3)),
      "",
      CTAa[3],
      "",
      "شير البوست يمكن يكون سبب في فرصة شغل لحد تعرفه ❤️"
    ].join("\n").replace(/\n{3,}/g,"\n\n").trim()+tagLine(4)});
  }
  return out;
}

/* Studio list = untouched Original + generated versions in the selected language */
function studioVersions(o){
  var lang = state.studioLang||"en";
  var list=[];
  if(lang==="en"){ var orig = fbWithTags(o) || o.facebookPost || ""; if(orig && orig.trim()) list.push({label:"Original", text:orig}); }
  list=list.concat(postVariations(o, lang));
  return list.slice(0,3);
}

/* one-tap buttons on the offer card — open each version in the Studio */
function fbVersionButtons(o){
  var vs=studioVersions(o);
  return vs.map(function(v,idx){
    return '<button class="fb-ver-btn" data-openver="'+idx+'" data-id="'+o.id+'" data-stop title="'+esc(v.label)+'">📣 '+esc(v.label)+'</button>';
  }).join("");
}

/* auto hashtags per offer — ~5 English + 3 Arabic, most relevant first */
function offerHashtags(o){
  var t=(o.type||"").toLowerCase(), blob=channelBlob(o);
  var locBlob=((o.branch||"")+" "+blob).toLowerCase();
  var en=[], ar=[];
  if(t.indexOf("telesales")!==-1 || blob.indexOf("sales")!==-1){
    en.push("#Telesales","#Sales","#SalesJobs"); ar.push("#تلي_سيلز","#وظائف_سيلز");
    if(blob.indexOf("outbound")!==-1 || blob.indexOf("cold")!==-1){ en.push("#ColdCalling","#OutboundSales"); ar.push("#اوتباوند"); }
  }
  if(t.indexOf("customer")!==-1){ en.push("#CustomerService","#CallCenter","#CustomerServiceJobs"); ar.push("#خدمة_عملاء","#كول_سنتر"); }
  if(blob.indexOf("chat")!==-1){ en.push("#ChatSupport","#NonVoice"); ar.push("#شغل_شات"); }
  if(blob.indexOf("back office")!==-1 || blob.indexOf("backoffice")!==-1 || blob.indexOf("back-office")!==-1){ en.push("#BackOffice","#BackOfficeJobs"); ar.push("#باك_اوفيس"); }
  if(blob.indexOf("technical")!==-1 || blob.indexOf("tech support")!==-1 || blob.indexOf("it support")!==-1){ en.push("#TechnicalSupport","#TechSupport"); ar.push("#دعم_فني"); }
  if(locBlob.indexOf("wfh")!==-1 || locBlob.indexOf("work from home")!==-1 || locBlob.indexOf("remote")!==-1){ en.push("#RemoteJobs","#WorkFromHome"); ar.push("#شغل_من_البيت"); }
  if((o.languageLevel||"").trim()){ en.push("#EnglishJobs"); ar.push("#شغل_انجليزي"); }
  if(isNoExp(o)){ en.push("#FreshGraduates","#NoExperience"); ar.push("#حديثي_التخرج"); }
  en.push("#EgyptJobs","#JobsInCairo"); ar.push("#وظائف_مصر","#فرص_عمل");
  return uniqArr(en).slice(0,5).concat(uniqArr(ar).slice(0,3)).join(" ");
}
/* headline monthly base in K (first figure before any "+"), ignoring commission tiers */
function baseSalaryK(o){
  var s=(o.salary||"").split("+")[0];
  var m=s.match(/([\d][\d,\.]*)\s*(k|,000|000)?/i);
  if(!m) return 0;
  var n=parseFloat(m[1].replace(/,/g,""));
  if(isNaN(n)) return 0;
  if(/k/i.test(m[2]||"")) return n;            /* "20K" */
  if(n>=1000) return n/1000;                    /* "20,000" */
  return n;                                      /* bare "20" */
}
function chipBar(){
  var defs=chipDefs();
  var active=state.chip||"all";
  return '<div class="chip-bar">'+defs.map(function(d){
    var n=AO().filter(d.test).length;
    if(d.key!=="all" && n===0) return "";   /* hide empty chips */
    var on=(d.key===active)?" on":"";
    return '<button class="chip'+on+'" data-chip="'+d.key+'">'+(d.icon?d.icon+' ':'')+d.label+'<span class="chip-n">'+n+'</span></button>';
  }).join("")+'</div>';
}

function fmtEGP(n){ if(n==null||n===""||isNaN(+n))return null; return (+n).toLocaleString('en-US')+' EGP'; }
function commissionBlock(o){

    if(!rec) return '';

  }
  var ws=o.ws||"ak";
  function row(cls,rank,role,val,net){ return '<div class="comm-row '+cls+'"><span class="comm-rank">'+rank+'</span><span class="comm-role">'+role+'</span><span class="comm-val">'+val+(net?' <span class="comm-netc">صافي '+net+'</span>':'')+'</span></div>'; }
  var num=function(v){return (typeof v==="number")?v:0;};
  var rows='', personal=0;
  var um=fmtEGP(o.commUM), tl=fmtEGP(o.commTL);
  /* Whole unit takes the full chain. Domus Meriti = Recruiter + Team Leader (no UM tier). LeadPoint = Recruiter + Team Leader + Unit Manager. */
  var _uN=(num(o.commUM)&&num(o.commTL))?fmtEGP(num(o.commUM)-num(o.commTL)):(num(o.commUM)&&num(o.commissionAmt)?fmtEGP(num(o.commUM)-num(o.commissionAmt)):null);
  var _tN=(num(o.commTL)&&num(o.commissionAmt))?fmtEGP(num(o.commTL)-num(o.commissionAmt)):null;
  if(um) rows+=row('comm-um','👑','Unit Manager',um,_uN);
  if(tl) rows+=row('comm-tl','👤','Team Leader',tl,_tN);
  if(rec) rows+=row('comm-rec','🧑‍💼','Recruiter',rec,(_uN||_tN)?rec:null);
  personal=Math.max(num(o.commUM),num(o.commTL),num(o.commissionAmt)); /* nested: UM pays TL, TL pays recruiter */
  var _n=[];
  if(num(o.commUM)&&num(o.commTL)) _n.push('👑 صافيك '+fmtEGP(num(o.commUM)-num(o.commTL)));
  if(num(o.commTL)&&num(o.commissionAmt)) _n.push('👤 TL '+fmtEGP(num(o.commTL)-num(o.commissionAmt)));
  if(num(o.commissionAmt)) _n.push('🧑‍💼 Rec '+fmtEGP(num(o.commissionAmt)));
  var nets=_n.length>1?'<div class="comm-net">'+_n.join(' · ')+'</div>':'';

function nextDateFor(dayName){
  var names=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var target=names.indexOf(dayName);
  if(target<0) return dayName;
  var t=new Date(); t.setHours(0,0,0,0);
  var diff=(target-t.getDay()+7)%7;           /* 0 = today, else next occurrence */
  var d=new Date(t.getTime()+diff*86400000);
  var mon=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];
  return dayName+" "+d.getDate()+" "+mon;
}
function confirmSection(o){

    ? o.ivDays.map(function(dn){ var v=nextDateFor(dn); return '<option value="'+esc(v)+'">'+esc(v)+'</option>'; }).join("")
    : '<option value="">(any day)</option>';
  var timeOpts=(o.ivSlots&&o.ivSlots.length)
    ? o.ivSlots.map(function(s){ return '<option value="'+esc(s)+'">'+esc(s)+'</option>'; }).join("")
    : '<option value="">(as scheduled)</option>';
  var winLbl = (o.ivDays&&o.ivDays.length) ? (o.ivDays[0]+(o.ivDays.length>1?'–'+o.ivDays[o.ivDays.length-1]:'')) : '';
  return '<div class="confirm-block" id="confirm-block">'
    +'<div class="confirm-head"><span class="confirm-icon">📅</span>Interview Confirmation Message</div>'
    +'<div class="confirm-sub">Pick the day &amp; time'+(winLbl?' (available: '+esc(winLbl)+')':'')+', then copy the ready message for the candidate.</div>'
    +'<div class="confirm-form">'
      +'<label class="confirm-field"><span>Interview day</span><select id="cf-date" class="confirm-select">'+dayOpts+'</select></label>'
      +'<label class="confirm-field"><span>Time slot</span><select id="cf-time" class="confirm-select">'+timeOpts+'</select></label>'
    +'</div>'
    +'<button class="confirm-copy-btn" data-action="confirm-copy" data-id="'+o.id+'"><span class="copy-button-icon">📋</span> Copy Confirmation Message</button>'
    +'<div class="confirm-preview-lbl">✅ Ready message (updates as you choose):</div>'
    +'<div class="confirm-preview" id="cf-preview">'+esc(buildConfirm(o))+'</div>'
    +'</div>';
}
function buildConfirm(o){
  var de=document.getElementById("cf-date"), te=document.getElementById("cf-time");
  var date=de?de.value:((o.ivDays&&o.ivDays.length)?nextDateFor(o.ivDays[0]):"");
  var time=te?te.value:((o.ivSlots&&o.ivSlots.length)?o.ivSlots[0]:"");
  var m=o.confirmMsg;
  m=m.replace(/\.{3,}/, "Ahmed");

  if(time) m=m.replace("*Time* PM – *Time* PM", time).replace("*Time* PM - *Time* PM", time);
  return m;
}

function mountSnow(){
  try{
    if(document.getElementById("dm-snow")) return;
    var n=20, out="";
    for(var i=0;i<n;i++){
      var left=((i*4.7+(i%3)*3.1)%100).toFixed(1);
      var dur=(10+(i%6)*2.4).toFixed(1), delay=(-(i*1.7)).toFixed(1);
      var size=(2+(i%3)), op=(0.14+(i%4)*0.05).toFixed(2), drift=(8+(i%5)*7);
      out+='<i style="left:'+left+'%;width:'+size+'px;height:'+size+'px;--drift:'+drift+'px;animation-duration:'+dur+'s;animation-delay:'+delay+'s;opacity:'+op+'"></i>';
    }
    var d=document.createElement("div"); d.id="dm-snow"; d.className="snow"; d.setAttribute("aria-hidden","true");
    d.innerHTML=out; document.body.appendChild(d);
  }catch(_){}
}
